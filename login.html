<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In — ElectroShop</title>
  </head>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous"
  />

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
  />
  <body class="bg-light d-flex align-items-center min-vh-100 py-4">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-sm-8 col-md-6 col-lg-4">
          <!-- Logo / Back to shop -->
          <div class="text-center mb-4">
            <a
              href="index.html"
              class="text-decoration-none text-dark d-inline-flex align-items-center gap-2"
            >
              <i class="bi bi-cpu fs-2 text-primary"></i>
              <span class="h3 fw-bold mb-0">ElectroShop</span>
            </a>
          </div>

          <div class="card shadow-sm border-0 rounded-3">
            <div class="card-body p-4">
              <h4 class="card-title fw-bold mb-1 text-center">Welcome Back</h4>
              <p class="text-muted small text-center mb-4">
                Enter your credentials to access your account
              </p>

              <form id="loginPageForm">
                <div class="mb-3">
                  <label class="form-label small fw-semibold text-muted"
                    >Email address</label
                  >
                  <input
                    type="email"
                    name="email"
                    class="form-control"
                    id="loginEmail"
                    placeholder="name@example.com"
                    required
                  />
                  <div class="invalid-feedback">
                    Your last name must be between 3 and 40 characters long
                  </div>
                </div>
                <div class="mb-3">
                  <label class="form-label small fw-semibold text-muted"
                    >Password</label
                  >
                  <input
                    type="password"
                    name="password"
                    class="form-control"
                    id="loginPassword"
                    placeholder="••••••••"
                    required
                  />
                  <div class="invalid-feedback">
                    Your last name must be between 3 and 40 characters long
                  </div>
                </div>
                <button
                  type="submit"
                  class="btn btn-primary w-100 py-2 fw-semibold"
                >
                  Sign In
                </button>
              </form>
            </div>
            <div class="card-footer bg-white border-0 text-center pb-4 pt-0">
              <p class="small text-muted mb-0">
                Don't have an account?
                <a
                  href="register.html"
                  class="text-primary fw-semibold text-decoration-none"
                  >Register</a
                >
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>

  <div
    class="toast-container position-fixed top-0 end-0 p-3"
    style="z-index: 1100"
  ></div>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"
  ></script>

  <script type="module" src="./login.js"></script>
</html>
