<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Shopping Assistant | ElectroShop</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="chatAI.css" />
  </head>
  <body class="bg-light">
    <header class="bg-white border-bottom py-2 mb-3 shadow-sm">
      <div
        class="container-fluid px-4 d-flex justify-content-between align-items-center"
      >
        <a
          href="index.html"
          class="text-decoration-none fw-bold fs-5 text-dark d-flex align-items-center"
        >
          <i class="bi bi-robot text-primary me-2 fs-4"></i>ElectroBot AI
          Assistant
        </a>
        <div class="d-flex align-items-center gap-2">
          <a href="chat.html" class="btn btn-outline-primary btn-sm">
            <i class="bi bi-headset me-1"></i> Human Support
          </a>
          <a href="index.html" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i> Store
          </a>
        </div>
      </div>
    </header>

    <main class="container-fluid px-4 mb-3">
      <div
        class="card border-0 shadow-sm rounded-3 overflow-hidden chat-app-height"
      >
        <div class="row g-0 h-100">
          <div
            class="col-12 col-md-4 col-lg-3 border-end d-flex flex-column h-100 bg-white"
          >
            <div class="p-3 border-bottom">
              <button
                id="btnNewChat"
                class="btn btn-primary w-100 d-flex align-items-center justify-content-center gap-2 rounded-pill shadow-sm"
              >
                <i class="bi bi-plus-lg"></i> New AI Chat
              </button>
            </div>

            <div
              class="p-3 pb-2 border-bottom bg-light d-flex justify-content-between align-items-center"
            >
              <span class="fw-semibold small text-dark">Your Chats</span>
              <span class="badge bg-secondary rounded-pill" id="chatCountBadge"
                >0</span
              >
            </div>

            <div class="flex-grow-1 chat-scroll" id="aiConversationsContainer">
              <div
                class="text-center text-muted py-5 small"
                id="noChatsPlaceholder"
              >
                <i
                  class="bi bi-chat-square-dots fs-3 d-block mb-2 text-secondary"
                ></i>
                No chats yet. Click <strong>"New AI Chat"</strong> to start!
              </div>
            </div>
          </div>

          <div
            class="col-12 col-md-8 col-lg-9 d-flex flex-column h-100 bg-white"
          >
            <div
              id="noChatSelectedView"
              class="h-100 d-flex flex-column align-items-center justify-content-center text-muted p-4"
            >
              <i class="bi bi-robot fs-1 mb-3 text-primary opacity-50"></i>
              <h5 class="fw-bold text-dark">ElectroBot AI Assistant</h5>
              <p
                class="small text-center text-secondary"
                style="max-width: 400px"
              >
                Ask about laptops, smartphones, delivery times, or warranty
                terms. Select an existing chat or create a new one to begin.
              </p>
              <button
                id="btnStartPrompt"
                class="btn btn-outline-primary btn-sm rounded-pill px-3"
              >
                <i class="bi bi-chat-dots me-1"></i> Start a Conversation
              </button>
            </div>

            <div id="activeChatView" class="d-none d-flex flex-column h-100">
              <div
                class="p-3 border-bottom d-flex align-items-center justify-content-between bg-white"
              >
                <div class="d-flex align-items-center gap-3">
                  <div
                    class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center fw-bold shadow-sm"
                    style="width: 40px; height: 40px"
                  >
                    <i class="bi bi-robot"></i>
                  </div>
                  <div>
                    <h6
                      class="mb-0 fw-bold text-dark text-truncate"
                      style="max-width: 350px"
                      id="activeChatHeaderTitle"
                    >
                      New Chat
                    </h6>
                    <small class="text-success d-flex align-items-center gap-1">
                      <span class="badge rounded-pill bg-success p-1"></span>
                      Online (24/7 AI)
                    </small>
                  </div>
                </div>
              </div>

              <div
                class="flex-grow-1 p-3 chat-scroll bg-light d-flex flex-column gap-2"
                id="aiMessagesList"
              ></div>

              <div class="p-3 border-top bg-white">
                <form id="aiChatForm" class="d-flex gap-2 align-items-center">
                  <input
                    type="text"
                    id="aiChatInput"
                    class="form-control rounded-pill px-3"
                    placeholder="Ask about product specs, delivery, or returns..."
                    autocomplete="off"
                    required
                  />
                  <button
                    type="submit"
                    id="btnSubmit"
                    class="btn btn-primary rounded-circle d-flex align-items-center justify-content-center"
                    style="width: 42px; height: 42px; flex-shrink: 0"
                  >
                    <i class="bi bi-send-fill"></i>
                  </button>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <div
      class="toast-container position-fixed top-0 end-0 p-3"
      style="z-index: 1100"
    ></div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <script type="module" src="chatAI.js"></script>
  </body>
</html>
